name: Used By Action
description: Generate a Used By badge from GitHub dependents or deps.dev dependents.
author: shenxianpeng
branding:
  icon: "thumbs-up"
  color: "green"
inputs:
  source:
    description: "Where the count comes from: 'github' (dependents of repo) or 'deps.dev' (dependents of package in ecosystem). Defaults to 'github'."
    required: false
    default: 'github'
  repo:
    description: GitHub repository name. e.g. shenxianpeng/used-by. Used with source 'github'. Defaults to shenxianpeng/used-by.
    required: false
    default: 'shenxianpeng/used-by'
  package:
    description: Package name for source 'deps.dev' (e.g. requests).
    required: false
    default: ''
  ecosystem:
    description: "Package ecosystem for source 'deps.dev': npm, pypi, maven or cargo."
    required: false
    default: ''
  package-version:
    description: Package version for source 'deps.dev', which counts dependents per version. Defaults to the version deps.dev marks as default.
    required: false
    default: ''
  file-path:
    description: The path to file. Defaults to 'README.md'.
    required: false
    default: 'README.md'
  badge-label:
    description: The badge display name. Defaults to 'Used by'.
    required: false
    default: 'Used by'
  badge-color:
    description: The badge display color. Defaults to 'informational'.
    required: false
    default: 'informational'
  badge-logo:
    description: The badge display logo. Defaults to 'slickpic'.
    required: false
    default: "slickpic"
  update-badge:
    description: Update an existing badge whose count changed ('true' or 'false'); a missing badge is always added. Defaults to 'false'.
    required: false
    default: "false"
  max-drop:
    description: Skip the update when the count drops by more than this percentage (0-100), which usually means the source returned bad data. Use 100 to accept any drop. Defaults to 50.
    required: false
    default: "50"

runs:
  using: "composite"
  steps:
    - name: Install and run used-by
      shell: bash
      env:
        # Pass inputs through the environment instead of expanding them into
        # the script, so their values are never interpreted by the shell.
        USED_BY_SOURCE: ${{ inputs.source }}
        USED_BY_REPO: ${{ inputs.repo }}
        USED_BY_PACKAGE: ${{ inputs.package }}
        USED_BY_ECOSYSTEM: ${{ inputs.ecosystem }}
        USED_BY_PACKAGE_VERSION: ${{ inputs.package-version }}
        USED_BY_FILE_PATH: ${{ inputs.file-path }}
        USED_BY_BADGE_LABEL: ${{ inputs.badge-label }}
        USED_BY_BADGE_COLOR: ${{ inputs.badge-color }}
        USED_BY_BADGE_LOGO: ${{ inputs.badge-logo }}
        USED_BY_UPDATE_BADGE: ${{ inputs.update-badge }}
        USED_BY_MAX_DROP: ${{ inputs.max-drop }}
      run: |
        # Keep the virtualenv out of the caller's checkout.
        python3 -m venv "$RUNNER_TEMP/used-by-venv"
        source "$RUNNER_TEMP/used-by-venv/bin/activate"
        # try to fix https://github.com/pypa/setuptools/issues/3269
        python3 -m pip install pip -U
        # Install the used-by code from this same ref of the action, so the
        # CLI always accepts the options passed below. Build from a copy so
        # no build files end up in the caller's checkout.
        cp -R "$GITHUB_ACTION_PATH" "$RUNNER_TEMP/used-by-src"
        pip install "$RUNNER_TEMP/used-by-src"

        args=(
          --source="$USED_BY_SOURCE"
          --file-path="$USED_BY_FILE_PATH"
          --badge-label="$USED_BY_BADGE_LABEL"
          --badge-color="$USED_BY_BADGE_COLOR"
          --badge-logo="$USED_BY_BADGE_LOGO"
          --update-badge="$USED_BY_UPDATE_BADGE"
          --max-drop="$USED_BY_MAX_DROP"
        )
        # Pass the optional inputs only when they are set.
        if [ -n "$USED_BY_REPO" ]; then args+=(--repo="$USED_BY_REPO"); fi
        if [ -n "$USED_BY_PACKAGE" ]; then args+=(--package="$USED_BY_PACKAGE"); fi
        if [ -n "$USED_BY_ECOSYSTEM" ]; then args+=(--ecosystem="$USED_BY_ECOSYSTEM"); fi
        if [ -n "$USED_BY_PACKAGE_VERSION" ]; then args+=(--package-version="$USED_BY_PACKAGE_VERSION"); fi

        used-by "${args[@]}"
