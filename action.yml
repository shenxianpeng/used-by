name: Used By Action
description: Generate Used By badge from GitHub dependents information.
author: shenxianpeng
branding:
  icon: "thumbs-up"
  color: "green"
inputs:
  repo:
    description: GitHub repository name. e.g. shenxianpeng/used-by. Defaults to shenxianpeng/used-by.
    required: true
    default: 'shenxianpeng/used-by'
  file-path:
    description: The path to file. Defaults to 'README.md'.
    required: false
    default: 'README.md'
  badge-label:
    description: The badge display name. Defaults to 'Used by'.
    required: false
    default: 'Used by'
  badge-color:
    description: The badge display color. Defaults to 'informational'.
    required: false
    default: 'informational'
  badge-logo:
    description: The badge display logo. Defaults to 'github'.
    required: false
    default: "github"
  number-format:
    description: "How the count is shown: 'short' (1.2k, 4.3M) or 'full' (1234, 4300000). Defaults to 'short'."
    required: false
    default: "short"
  update-badge:
    description: Update an existing badge whose count changed ('true' or 'false'); a missing badge is always added. Defaults to 'false'.
    required: false
    default: "false"
  max-drop:
    description: Skip the update when the count drops by more than this percentage (0-100), which usually means GitHub returned bad data. Use 100 to accept any drop. Defaults to 50.
    required: false
    default: "50"

runs:
  using: "composite"
  steps:
    - name: Install and run used-by
      shell: bash
      env:
        # Pass inputs through the environment instead of expanding them into
        # the script, so their values are never interpreted by the shell.
        USED_BY_REPO: ${{ inputs.repo }}
        USED_BY_FILE_PATH: ${{ inputs.file-path }}
        USED_BY_BADGE_LABEL: ${{ inputs.badge-label }}
        USED_BY_BADGE_COLOR: ${{ inputs.badge-color }}
        USED_BY_BADGE_LOGO: ${{ inputs.badge-logo }}
        USED_BY_NUMBER_FORMAT: ${{ inputs.number-format }}
        USED_BY_UPDATE_BADGE: ${{ inputs.update-badge }}
        USED_BY_MAX_DROP: ${{ inputs.max-drop }}
      run: |
        # Keep the virtualenv out of the caller's checkout.
        python3 -m venv "$RUNNER_TEMP/used-by-venv"
        source "$RUNNER_TEMP/used-by-venv/bin/activate"
        # try to fix https://github.com/pypa/setuptools/issues/3269
        python3 -m pip install pip -U
        # Install the used-by code from this same ref of the action, so the
        # CLI always accepts the options passed below. Build from a copy so
        # no build files end up in the caller's checkout.
        cp -R "$GITHUB_ACTION_PATH" "$RUNNER_TEMP/used-by-src"
        pip install "$RUNNER_TEMP/used-by-src"

        used-by \
         --repo="$USED_BY_REPO" \
         --file-path="$USED_BY_FILE_PATH" \
         --badge-label="$USED_BY_BADGE_LABEL" \
         --badge-color="$USED_BY_BADGE_COLOR" \
         --badge-logo="$USED_BY_BADGE_LOGO" \
         --number-format="$USED_BY_NUMBER_FORMAT" \
         --update-badge="$USED_BY_UPDATE_BADGE" \
         --max-drop="$USED_BY_MAX_DROP"
